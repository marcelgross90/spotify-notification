name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - name: Show Swift version
        run: swift --version
      - name: Test
        run: make test
      - name: Build app
        run: make app
      - name: Verify app signature
        run: codesign --verify --deep --strict "dist/Spotify Notification.app"
